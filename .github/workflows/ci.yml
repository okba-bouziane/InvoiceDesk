name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The unit tests need no model weights and no GPU.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install "transformers>=4.45,<5" "sentencepiece>=0.2" "pillow>=10" "matplotlib>=3.9" "fastapi>=0.115" "python-multipart>=0.0.9" "httpx>=0.27" "pytest>=8" ruff
      - run: ruff check .
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t invoicedesk .
